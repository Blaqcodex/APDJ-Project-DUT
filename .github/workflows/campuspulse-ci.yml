name: CampusPulse CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Admin and API
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Admin dependencies
        run: dotnet restore ./CampusPulse.Admin/CampusPulse.Admin.csproj

      - name: Restore API dependencies
        run: dotnet restore ./CampusPulse.API/CampusPulse.API.csproj

      - name: Build Admin (Release)
        run: dotnet build ./CampusPulse.Admin/CampusPulse.Admin.csproj --configuration Release --no-restore

      - name: Build API (Release)
        run: dotnet build ./CampusPulse.API/CampusPulse.API.csproj --configuration Release --no-restore